openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getHello
      summary: Get a greeting for an optional name
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet; a default greeting is returned when omitted or empty
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The greeting text, e.g. "Hello, World!" or "Hello, Alice!"
